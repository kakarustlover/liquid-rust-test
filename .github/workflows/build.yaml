name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK platform and build-tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-apk
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: apk-${{ runner.os }}-${{ hashFiles('Cargo.toml') }}
          restore-keys: apk-${{ runner.os }}-

      - name: Install cargo-apk
        run: command -v cargo-apk || cargo install cargo-apk --locked

      - name: Create signing keystore
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.keystore" \
            -alias liquid -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Liquid Rust, O=al1h3n, C=US"

      - name: Build APK
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_LATEST_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
          CARGO_APK_RELEASE_KEYSTORE: ${{ runner.temp }}/release.keystore
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: android
        run: cargo apk build --release

      - uses: actions/upload-artifact@v4
        with:
          name: LiquidRust-apk
          path: target/release/apk/*.apk
          if-no-files-found: error
